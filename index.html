<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>UAT Embedded Messaging Launcher</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
      /* Simple button styling */
      #miaw-start {
        padding: 10px 16px;
        font-size: 14px;
        cursor: pointer;
        background: #0070d2;   /* Salesforce blue */
        color: #fff;
        border: none;
        border-radius: 4px;
      }
      #miaw-start:hover {
        background: #005fb2;
      }
    </style>
  </head>

  <body>
    <!-- ONE BUTTON that starts Messaging on click -->
    <button id="miaw-start" type="button" onclick="startMessaging()">
      Chat with Us
    </button>

    <!-- Your Messaging init function (unchanged in substance) -->
    <script type="text/javascript">
      function initEmbeddedMessaging() {
        try {
          // Language can be 'en' or 'en-US'
          embeddedservice_bootstrap.settings.language = 'en_US';

          // Optional: listen for readiness (useful if you want to call APIs like launchChat/prechat afterwards)
          window.addEventListener('onEmbeddedMessagingReady', () => {
            console.log('[MIAW] Messaging client is ready');
            // Example: open the chat when ready (uncomment if desired)
            // embeddedservice_bootstrap.utilAPI.launchChat();
          });

          // Initialize Messaging (MIAW)
          embeddedservice_bootstrap.init(
            '00D9p000004KUXV', // Org ID
            'Messaging_Routing_Channel', // Deployment (Channel) Name
            'https://teamglobalexp--tollperf.sandbox.my.site.com/ESWMessagingRoutingChan1763462090439', // Site endpoint
            {
              scrt2URL: 'https://teamglobalexp--tollperf.sandbox.my.salesforce-scrt.com'
            }
          );
        } catch (err) {
          console.error('Error loading Embedded Messaging: ', err);
        }
      }

      // Button handler: ensures the bootstrap script is present, then runs initEmbeddedMessaging()
      function startMessaging() {
        // If the global already exists, init immediately
        if (window.embeddedservice_bootstrap) {
          initEmbeddedMessaging();
          return;
        }

        // Otherwise, load bootstrap.min.js and init once it’s loaded
        var src = 'https://teamglobalexp--tollperf.sandbox.my.site.com/ESWMessagingRoutingChan1763462090439/assets/js/bootstrap.min.js';
        var script = document.createElement('script');
        script.src = src;
        script.type = 'text/javascript';

        script.onload = function () {
          console.log('[MIAW] bootstrap.min.js loaded');
          initEmbeddedMessaging();
        };
        script.onerror = function (e) {
          console.error('[MIAW] Failed to load bootstrap.min.js from:', src, e);
        };

        document.head.appendChild(script);
      }
    </script>
  </body>
</html>

    .embedded-messaging[style],

    .embeddedservice-help-button,
    .esw-button,
    iframe[id*="embedded-messaging"],
    iframe[src*="embeddedservice"] {
      z-index: 2147483647 !important;
    }

    /* --- Spinner Overlay Styles --- */
    .spinner-overlay {
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(1px);
      display: none;            /* hidden by default */
      align-items: center;
      justify-content: center;
      z-index: 2147483646;      /* just below widget */
    }
    .spinner-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 20px 24px;
      border-radius: 12px;
      background: rgba(255,255,255,0.9);
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
    }
    .spinner {
      width: 64px;
      height: 64px;
      border: 6px solid #e0e0e0;
      border-top-color: #1976d2; /* primary color */
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    .spinner-message {
      font-size: 1rem;
      color: #333;
      text-align: center;
      min-width: 240px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Optional small toast for errors (non-blocking) */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #323232;
      color: #fff;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.95rem;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
      max-width: 90vw;
      display: none;
      z-index: 2147483647;
    }
  </style>
</head>
<body>

  <h1>Load Salesforce Embedded Messaging (UAT)</h1>
  <p>Click the button to load the Embedded Messaging script and initialize the bot.</p>

  <button id="loadBotBtn">Launch Customer Service Bot</button>

  <div id="spinnerOverlay" class="spinner-overlay" role="status" aria-live="polite" aria-label="Loading chat widget">
    <div class="spinner-box">
      <div class="spinner" aria-hidden="true"></div>
      <div id="spinnerMsg" class="spinner-message">Initiating the chat...</div>
    </div>
  </div>

  <div id="toast" class="toast" role="alert" aria-live="assertive"></div>

  <script>
    // -------- Utilities: spinner, message & toast --------
    function showSpinner(message = 'Loading the chat…') {
      const ov = document.getElementById('spinnerOverlay');
      const msg = document.getElementById('spinnerMsg');
      if (msg) msg.textContent = message;
      if (ov) ov.style.display = 'flex';
    }
    function updateSpinnerMessage(message) {
      const msg = document.getElementById('spinnerMsg');
      if (msg) msg.textContent = message;
    }
    function hideSpinner() {
      const ov = document.getElementById('spinnerOverlay');
      if (ov) ov.style.display = 'none';
    }
    function showToast(message, ms = 3000) {
      const t = document.getElementById('toast');
      if (!t) return;
      t.textContent = message;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, ms);
    }

    // -------- State --------
    let eswInitialized = false;
    let eswScriptLoaded = false;
    let eswScriptLoading = false;

    // -------- Init (UAT) --------
    function initEmbeddedMessaging() {
      if (eswInitialized) {
        // Spinner will be managed by visibility checker
        return;
      }

      try {
        if (!window.embeddedservice_bootstrap) {
          // Keep spinner visible; likely loading bootstrap or blocked by CSP.
          console.warn('[ESW] bootstrap not available yet.');
          return;
        }

        // Configure language
        embeddedservice_bootstrap.settings.language = 'en_US';

    function checkWidgetVisible(attempts, intervalMs) {
      let tries = 0;
      const timer = setInterval(function () {
        tries++;

        const possibleEls = [
          document.querySelector('iframe[src*="embeddedservice"]'),
          document.querySelector('iframe[id*="embedded-messaging"]'),
          document.querySelector('.embeddedservice-help-button'),
          document.querySelector('.esw-button'),
          document.querySelector('.embedded-messaging')
        ].filter(Boolean);

        if (possibleEls.length > 0) {
          // Chat widget is present, hide spinner
          hideSpinner();
          clearInterval(timer);
        } else if (tries >= attempts) {
          // Stop spinner (don’t block the page) & show a non-blocking message
          hideSpinner();
          console.warn('[ESW] Chat widget not found after init.');
          showToast('Chat widget did not appear. Check console/network and org configuration.');
          clearInterval(timer);
        } else {
          // Optional: show progressive messaging while waiting
          if (tries === 1) updateSpinnerMessage('Loading chat resources…');
          if (tries === Math.ceil(attempts / 2)) updateSpinnerMessage('Almost there…');
